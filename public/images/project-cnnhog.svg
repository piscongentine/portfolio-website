<svg viewBox="0 0 800 600" width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow3" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#7f40ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7f40ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7f40ff"/>
      <stop offset="100%" stop-color="#c2a4ff"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="#0b080c"/>
  <rect width="800" height="600" fill="url(#glow3)"/>

  <rect x="40" y="40" width="720" height="520" rx="18" fill="#141018" stroke="#2a2432" stroke-width="1.5"/>

  <!-- CNN layers (left) -->
  <g>
    <!-- layer 1 -->
    <g transform="translate(130,150)">
      <circle cy="0"   r="9" fill="#3a3340"/>
      <circle cy="50"  r="9" fill="#7f40ff"/>
      <circle cy="100" r="9" fill="#3a3340"/>
      <circle cy="150" r="9" fill="#7f40ff"/>
      <circle cy="200" r="9" fill="#3a3340"/>
      <circle cy="250" r="9" fill="#7f40ff"/>
      <circle cy="300" r="9" fill="#3a3340"/>
    </g>
    <!-- layer 2 -->
    <g transform="translate(230,190)">
      <circle cy="0"   r="9" fill="#7f40ff"/>
      <circle cy="60"  r="9" fill="#3a3340"/>
      <circle cy="120" r="9" fill="#c2a4ff"/>
      <circle cy="180" r="9" fill="#3a3340"/>
      <circle cy="240" r="9" fill="#7f40ff"/>
    </g>
    <!-- layer 3 -->
    <g transform="translate(330,230)">
      <circle cy="0"   r="9" fill="#c2a4ff"/>
      <circle cy="70"  r="9" fill="#7f40ff"/>
      <circle cy="140" r="9" fill="#c2a4ff"/>
    </g>

    <!-- connections (sampled) -->
    <g stroke="#4a3f5c" stroke-width="1" opacity="0.7">
      <line x1="130" y1="200" x2="230" y2="190"/>
      <line x1="130" y1="300" x2="230" y2="250"/>
      <line x1="130" y1="400" x2="230" y2="370"/>
      <line x1="130" y1="150" x2="230" y2="190"/>
      <line x1="230" y1="190" x2="330" y2="230"/>
      <line x1="230" y1="310" x2="330" y2="300"/>
      <line x1="230" y1="430" x2="330" y2="370"/>
      <line x1="330" y1="230" x2="430" y2="300"/>
      <line x1="330" y1="300" x2="430" y2="300"/>
      <line x1="330" y1="370" x2="430" y2="300"/>
    </g>
  </g>

  <!-- gradient/edge-detected face outline (right) -->
  <g transform="translate(560,300)" fill="none" stroke="url(#edge)" stroke-width="3" stroke-linejoin="round">
    <path d="M0,-150 C70,-150 110,-90 110,-20 C110,60 70,120 0,150 C-70,120 -110,60 -110,-20 C-110,-90 -70,-150 0,-150 Z"/>
    <path d="M-45,-30 q15,-15 30,0" stroke-width="4" stroke-linecap="round"/>
    <path d="M15,-30 q15,-15 30,0" stroke-width="4" stroke-linecap="round"/>
    <path d="M-10,10 q10,15 20,0" stroke-width="4" stroke-linecap="round"/>
    <path d="M-30,70 q30,25 60,0" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- HOG gradient arrows around the face -->
  <g stroke="#d29bff" stroke-width="2" stroke-linecap="round" opacity="0.8">
    <line x1="430" y1="180" x2="450" y2="165"/>
    <line x1="450" y1="210" x2="472" y2="198"/>
    <line x1="440" y1="250" x2="464" y2="245"/>
    <line x1="680" y1="180" x2="660" y2="165"/>
    <line x1="660" y1="210" x2="640" y2="198"/>
    <line x1="670" y1="250" x2="648" y2="245"/>
    <line x1="480" y1="420" x2="500" y2="405"/>
    <line x1="620" y1="420" x2="600" y2="405"/>
  </g>
</svg>
