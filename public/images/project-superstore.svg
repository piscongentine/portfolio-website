<svg viewBox="0 0 800 600" width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow1" cx="80%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#7f40ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7f40ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar1" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#5a2fd6"/>
      <stop offset="100%" stop-color="#c2a4ff"/>
    </linearGradient>
    <linearGradient id="donutGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c2a4ff"/>
      <stop offset="100%" stop-color="#7f40ff"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="#0b080c"/>
  <rect width="800" height="600" fill="url(#glow1)"/>

  <rect x="40" y="40" width="720" height="520" rx="18" fill="#141018" stroke="#2a2432" stroke-width="1.5"/>

  <circle cx="90" cy="76" r="5" fill="#7f40ff"/>
  <circle cx="112" cy="76" r="5" fill="#3a3340"/>
  <circle cx="134" cy="76" r="5" fill="#3a3340"/>
  <rect x="620" y="66" width="100" height="20" rx="10" fill="#1f1a26" stroke="#3a3340"/>

  <!-- Donut chart: profit distribution -->
  <g transform="translate(210,300)">
    <circle r="110" fill="none" stroke="#221c2b" stroke-width="34"/>
    <circle r="110" fill="none" stroke="url(#donutGrad)" stroke-width="34"
      stroke-dasharray="470 691" stroke-dashoffset="0" stroke-linecap="round"
      transform="rotate(-90)"/>
    <circle r="110" fill="none" stroke="#d29bff" stroke-width="34" opacity="0.85"
      stroke-dasharray="140 691" stroke-dashoffset="-470" stroke-linecap="round"
      transform="rotate(-90)"/>
    <circle r="110" fill="none" stroke="#4a2f8f" stroke-width="34" opacity="0.9"
      stroke-dasharray="81 691" stroke-dashoffset="-610" stroke-linecap="round"
      transform="rotate(-90)"/>
    <circle r="58" fill="#141018"/>
  </g>

  <!-- Bar chart: transaction volume -->
  <g transform="translate(470,470)">
    <rect x="0"   y="-70"  width="34" height="70"  rx="6" fill="url(#bar1)"/>
    <rect x="46"  y="-120" width="34" height="120" rx="6" fill="url(#bar1)"/>
    <rect x="92"  y="-95"  width="34" height="95"  rx="6" fill="url(#bar1)"/>
    <rect x="138" y="-160" width="34" height="160" rx="6" fill="url(#bar1)"/>
    <rect x="184" y="-55"  width="34" height="55"  rx="6" fill="url(#bar1)"/>
    <line x1="-10" y1="0" x2="230" y2="0" stroke="#3a3340" stroke-width="1.5"/>
  </g>

  <!-- Pareto trend line -->
  <polyline points="470,150 530,190 586,175 642,230 698,205"
    fill="none" stroke="#d29bff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="470" cy="150" r="5" fill="#d29bff"/>
  <circle cx="530" cy="190" r="5" fill="#d29bff"/>
  <circle cx="586" cy="175" r="5" fill="#d29bff"/>
  <circle cx="642" cy="230" r="5" fill="#d29bff"/>
  <circle cx="698" cy="205" r="5" fill="#d29bff"/>

  <rect x="80" y="130" width="130" height="10" rx="5" fill="#3a3340"/>
  <rect x="80" y="150" width="80" height="8" rx="4" fill="#2a2432"/>
</svg>
