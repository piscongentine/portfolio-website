<svg viewBox="0 0 800 600" width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow4" cx="75%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#7f40ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7f40ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="thyroidGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c2a4ff"/>
      <stop offset="100%" stop-color="#7f40ff"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="#0b080c"/>
  <rect width="800" height="600" fill="url(#glow4)"/>

  <rect x="40" y="40" width="720" height="520" rx="18" fill="#141018" stroke="#2a2432" stroke-width="1.5"/>

  <!-- bot avatar circle -->
  <circle cx="150" cy="150" r="46" fill="#1f1a26" stroke="#3a3340"/>
  <!-- thyroid butterfly icon -->
  <g transform="translate(150,150)" fill="url(#thyroidGrad)">
    <path d="M0,-4 C-10,-22 -34,-22 -40,-4 C-46,12 -30,26 -6,20 C-8,10 -6,2 0,-4 Z"/>
    <path d="M0,-4 C10,-22 34,-22 40,-4 C46,12 30,26 6,20 C8,10 6,2 0,-4 Z"/>
    <rect x="-3" y="-4" width="6" height="16" rx="3"/>
  </g>

  <!-- chat bubbles -->
  <g>
    <rect x="230" y="100" width="330" height="60" rx="18" fill="#1f1a26" stroke="#3a3340"/>
    <rect x="255" y="120" width="220" height="10" rx="5" fill="#3a3340"/>
    <rect x="255" y="138" width="150" height="10" rx="5" fill="#2a2432"/>

    <rect x="330" y="190" width="330" height="60" rx="18" fill="url(#thyroidGrad)" opacity="0.9"/>
    <rect x="355" y="210" width="200" height="10" rx="5" fill="#0b080c" opacity="0.5"/>
    <rect x="355" y="228" width="130" height="10" rx="5" fill="#0b080c" opacity="0.35"/>

    <rect x="230" y="280" width="280" height="60" rx="18" fill="#1f1a26" stroke="#3a3340"/>
    <rect x="255" y="300" width="180" height="10" rx="5" fill="#3a3340"/>
    <rect x="255" y="318" width="120" height="10" rx="5" fill="#2a2432"/>
  </g>

  <!-- report / knowledge base card -->
  <g transform="translate(560,380)">
    <rect x="0" y="0" width="160" height="150" rx="12" fill="#0f0c13" stroke="#3a3340"/>
    <rect x="20" y="24" width="120" height="10" rx="5" fill="#c2a4ff"/>
    <rect x="20" y="48" width="90" height="8" rx="4" fill="#3a3340"/>
    <rect x="20" y="66" width="100" height="8" rx="4" fill="#3a3340"/>
    <rect x="20" y="84" width="70" height="8" rx="4" fill="#3a3340"/>
    <circle cx="35" cy="114" r="10" fill="none" stroke="#7f40ff" stroke-width="3"/>
    <path d="M42 121 l10 10" stroke="#7f40ff" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- typing indicator -->
  <g transform="translate(230,400)" fill="#7f40ff">
    <circle cx="0" cy="0" r="6"/>
    <circle cx="20" cy="0" r="6" opacity="0.7"/>
    <circle cx="40" cy="0" r="6" opacity="0.4"/>
  </g>
</svg>
