<svg viewBox="0 0 800 600" width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow2" cx="20%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#7f40ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7f40ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="faceGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c2a4ff"/>
      <stop offset="100%" stop-color="#7f40ff"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="#0b080c"/>
  <rect width="800" height="600" fill="url(#glow2)"/>

  <rect x="40" y="40" width="720" height="520" rx="18" fill="#141018" stroke="#2a2432" stroke-width="1.5"/>

  <!-- camera panel -->
  <rect x="80" y="80" width="360" height="440" rx="14" fill="#0f0c13" stroke="#2a2432"/>

  <!-- scan frame corners -->
  <g stroke="#c2a4ff" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M120 130 h40 M120 130 v40"/>
    <path d="M400 130 h-40 M400 130 v40"/>
    <path d="M120 470 h40 M120 470 v-40"/>
    <path d="M400 470 h-40 M400 470 v-40"/>
  </g>

  <!-- face silhouette -->
  <g transform="translate(260,300)">
    <ellipse cx="0" cy="-10" rx="80" ry="95" fill="url(#faceGrad)" opacity="0.9"/>
    <path d="M-80 40 Q0 140 80 40 L80 110 Q0 170 -80 110 Z" fill="url(#faceGrad)" opacity="0.9"/>
  </g>

  <!-- face landmark dots -->
  <g fill="#0b080c">
    <circle cx="225" cy="270" r="5"/>
    <circle cx="295" cy="270" r="5"/>
    <circle cx="260" cy="310" r="4"/>
  </g>
  <path d="M235 340 Q260 355 285 340" stroke="#0b080c" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- scan line -->
  <line x1="90" y1="230" x2="430" y2="230" stroke="#d29bff" stroke-width="2" opacity="0.8"/>

  <!-- attendance log list -->
  <g transform="translate(480,110)">
    <rect x="0" y="0" width="240" height="12" rx="6" fill="#3a3340"/>
    <rect x="0" y="26" width="160" height="8" rx="4" fill="#2a2432"/>

    <g transform="translate(0,60)">
      <circle cx="10" cy="10" r="10" fill="#7f40ff"/>
      <path d="M5 10 l4 4 l7 -8" stroke="#0b080c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="34" y="4" width="160" height="12" rx="6" fill="#241f2c"/>
    </g>
    <g transform="translate(0,100)">
      <circle cx="10" cy="10" r="10" fill="#7f40ff"/>
      <path d="M5 10 l4 4 l7 -8" stroke="#0b080c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="34" y="4" width="130" height="12" rx="6" fill="#241f2c"/>
    </g>
    <g transform="translate(0,140)">
      <circle cx="10" cy="10" r="10" fill="#c2a4ff"/>
      <path d="M5 10 l4 4 l7 -8" stroke="#0b080c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="34" y="4" width="180" height="12" rx="6" fill="#241f2c"/>
    </g>
    <g transform="translate(0,180)">
      <circle cx="10" cy="10" r="10" fill="#3a3340"/>
      <rect x="34" y="4" width="110" height="12" rx="6" fill="#241f2c"/>
    </g>
  </g>
</svg>
